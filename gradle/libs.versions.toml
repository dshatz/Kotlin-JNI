[versions]
lib = "1.0.0"
agp = "8.13.2"
kotlin = "2.3.0"
osdetector = "1.7.3"
kotest = "6.1.2"
kotlinpoet = "2.3.0"
ksp = "2.3.6"
publish = "0.36.0"
testBalloon = "0.8.4-K2.3.0"

[libraries]
kotest = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinpoet = { group = "com.squareup", name = "kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { group = "com.squareup", name = "kotlinpoet-ksp", version.ref = "kotlinpoet" }
ksp = { group = "com.google.devtools.ksp", name = "symbol-processing-api", version.ref = "ksp" }
test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.10.2" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.10.2" }
test-core = { module = "de.infix.testBalloon:testBalloon-framework-core", version.ref = "testBalloon" }
android-runner = { module = "androidx.test:runner", version = "1.7.0" }
test-kotest = { module = "de.infix.testBalloon:testBalloon-integration-kotest-assertions", version.ref = "testBalloon" }
junit4 = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
osdetector = { id = "com.google.osdetector", version.ref = "osdetector" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
dokka = { id = "org.jetbrains.dokka", version = "2.1.0" }
test = { id = "de.infix.testBalloon", version.ref = "testBalloon" }