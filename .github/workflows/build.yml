name: Test

on:
  pull_request:
    branches:
      - master
      - dev
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '**.txt'
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '**.txt'

jobs:
  test-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/build-setup
        with:
          configuration_cache_key: secrets.GRADLE_CONFIGURATION_CACHE_KEY

      - name: Build and Test
        run: |
          ./gradlew allTests assembleAndroidDeviceTest \
            -PkniNativeBuildType=debug \
            -PkniAllowedTargets=linuxX64,androidNativeArm64,wasmJs,js,wasmWasi
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m"
            -Dkotlin.daemon.jvm.options="-Xmx2048m"
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-ubuntu-latest
          path: ./**/build/test-results/**/*.xml
          retention-days: 5

  test-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/build-setup
        with:
          configuration_cache_key: secrets.GRADLE_CONFIGURATION_CACHE_KEY
      - name: Build and Test
        run: ./gradlew allTests -PkniNativeBuildType=debug -PkniAllowedTargets=mingwX64
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m"
            -Dkotlin.daemon.jvm.options="-Xmx2048m"
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-windows-latest
          path: ./**/build/test-results/**/*.xml

  test-macos:
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/build-setup
        with:
          configuration_cache_key: secrets.GRADLE_CONFIGURATION_CACHE_KEY
      - name: Build and Test
        run: |
          ./gradlew allTests -PkniNativeBuildType=debug \
            -PkniAllowedTargets=macosArm64,iosSimulatorArm64,tvosSimulatorArm64,watchosSimulatorArm64
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m"
            -Dkotlin.daemon.jvm.options="-Xmx2048m"
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-macos-latest
          path: ./**/build/test-results/**/*.xml
      - name: Upload crashdump
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crashdump-macos
          path: ./**/hs_err_*.log

  test-android-emulator:
    # Runs on an x86_64 emulator, needs no secrets, so it also works for fork PRs.
    strategy:
      matrix:
        module: ["e2e", "plugintest", "buffers"]
      fail-fast: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/build-setup
        with:
          configuration_cache_key: secrets.GRADLE_CONFIGURATION_CACHE_KEY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Instrumentation Tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >
            ./gradlew :${{matrix.module}}:connectedAndroidDeviceTest
            -PkniNativeBuildType=debug
            -PkniAllowedTargets=androidNativeX64
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m"
            -Dkotlin.daemon.jvm.options="-Xmx2048m"
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-emulator-android-${{matrix.module}}
          path: ./${{matrix.module}}/build/outputs/androidTest-results/**/*.xml
          retention-days: 5

  publish-results:
    needs:
      - test-linux
      - test-android-emulator
      - test-macos
      - test-windows
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/actions

      - name: Download Artifacts
        uses: actions/download-artifact@v8

      - name: Multiplatform Test Report
        uses: dshatz/testballoon-github-reporter@master
        with:
          reports: "test-report-*/**/*.xml"
          platform-hints: |
            {
              "test-report-ubuntu-latest/**/*.xml": "Linux",
              "test-report-windows-latest/**/*.xml": "Windows",
              "test-report-macos-latest/**/*.xml": "macOS",
              "test-report-emulator-android-*/**/*.xml": "Android (emulator)"
            }
