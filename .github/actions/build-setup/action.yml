name: "Setup gradle"
inputs:
  configuration_cache_key:
    required: true
    description: Encryption key for gradle configuration cache.
runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Only master and dev save caches; PRs and other branches restore from them.
        # Keeps total cache size under GitHub's 10 GB limit so the master entry isn't evicted.
        cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}
        cache-encryption-key: ${{ inputs.configuration_cache_key }}
